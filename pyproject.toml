[project]
name = "nasa-neo"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Falko Basner", email = "falko.basner@sap.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
nasa-neo = "nasa_neo:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
