name: Release

on:
  release:
    types: [published]

env:
  IMAGE: ghcr.io/falkobasner/nasa-neo

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag SHA image with release tag
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          docker tag  ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
          docker push ${{ env.IMAGE }}:${{ github.event.release.tag_name }}

  deploy:
    needs: retag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy via Helm
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" > /tmp/kubeconfig.yaml
          helm upgrade --install nasa-neo helm/nasa-neo \
            --namespace nasa \
            --kubeconfig /tmp/kubeconfig.yaml \
            --set image.tag=${{ github.event.release.tag_name }} \
            --wait
